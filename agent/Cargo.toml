[package]
name = "vercelify-agent"
description = "Host agent exposing disk, power, thermal, Tailscale, Docker and display control to the Vercelify cockpit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vercelify-agent"
path = "src/main.rs"

[dependencies]
vercelify-core = { workspace = true, features = ["collect"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "1.1"
subtle = "2"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# HTTP client for Coolify and Ollama on localhost (already built for axum).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
# Validates rule regexes as RE2 (what Traefik/Go accepts); already linked via tracing-subscriber.
regex-syntax = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
regex = "1"
