[package]
name = "vercelify-agent"
description = "Host agent and platform engine behind the Vercelify cockpit: apps, deploys, disks, power, mesh and display"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vercelify-agent"
path = "src/main.rs"

[dependencies]
vercelify-core = { workspace = true, features = ["collect"] }
vercelify-platform.workspace = true
vercelify-mesh.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "original-uri", "query", "tokio", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
subtle = "2"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# mDNS on 5353 next to Avahi (SO_REUSEPORT).
socket2 = { version = "0.6", features = ["all"] }
# HTTP client for Ollama and the proxy on localhost (already built for axum).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
# Validates rule regexes as RE2 (what Traefik/Go accepts).
regex-syntax = "0.8"
# Read the installer's shell-quoted backup credentials without evaluating them.
shlex = "2"

[dev-dependencies]
vercelify-mesh = { workspace = true, features = ["daemon"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
regex = "1"
