[package]
name = "vercelify-cockpit"
description = "Vercelify cockpit: control your self-hosted PaaS from your Mac"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vercelify_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vercelify-core = { workspace = true, features = ["collect"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
tempfile = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Virtual displays for an extended desktop (CGVirtualDisplay); already in the
# tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
