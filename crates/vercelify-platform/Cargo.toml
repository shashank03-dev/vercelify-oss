[package]
name = "vercelify-platform"
description = "Vercelify's control plane: state, secrets, builds, deployments and the runtime reconciler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vercelify-mesh.workspace = true
vercelify-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
tokio = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
bcrypt = { version = "0.16", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The client for workers' runtime API over the mesh (the agent links hyper already).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tempfile = "3"
