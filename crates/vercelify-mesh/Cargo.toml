[package]
name = "vercelify-mesh"
description = "Vercelify's private network: WireGuard mesh, coordinator protocol, relay and DNS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vercelify-mesh"
path = "src/main.rs"
required-features = ["daemon"]

[features]
default = []
# The data plane and the daemon (`vercelify-mesh`): WireGuard, tun, DNS, the
# map client. The agent uses the protocol types only and leaves this off.
daemon = ["dep:boringtun", "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:clap", "dep:tracing", "dep:tracing-subscriber", "dep:tokio-tungstenite", "dep:futures-util", "dep:tokio-rustls", "dep:webpki-roots", "dep:smoltcp"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
getrandom = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zeroize = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
libc = "0.2"
# Pairing by short code over the LAN (pake.rs).
spake2 = "0.4"

boringtun = { version = "0.7.1", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# The relay (a WebSocket) and https:// control URLs (a Cloudflare tunnel).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# Userspace TCP/IP for app mode on the Mac (no tun): SOCKS5 and forwards.
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv4-fragmentation", "fragmentation-buffer-size-2048", "proto-ipv6", "socket-tcp", "socket-udp"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
