[package]
name = "vercelify-core"
description = "Shared types and host probes for the Vercelify agent and cockpit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Live system collection via sysinfo (used by the agent and the cockpit's local view)
collect = ["dep:sysinfo"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
sysinfo = { workspace = true, optional = true }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
