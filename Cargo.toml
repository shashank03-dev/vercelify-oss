[workspace]
resolver = "2"
members = ["crates/vercelify-core", "agent", "cockpit/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shashank03-dev/vercelify-oss"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sysinfo = "0.39"
ts-rs = "12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
vercelify-core = { path = "crates/vercelify-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
