[workspace]
resolver = "2"
members = ["crates/vercelify-core", "crates/vercelify-platform", "crates/vercelify-mesh", "agent", "cockpit/src-tauri"]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/shashank03-dev/vercelify-oss"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# No `env-filter`: `filter::Targets` reads RUST_LOG's `target=level` directives
# without a regex engine (keeps the agent inside its size budget).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
sysinfo = "0.39"
ts-rs = "12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
vercelify-core = { path = "crates/vercelify-core" }
vercelify-platform = { path = "crates/vercelify-platform" }
vercelify-mesh = { path = "crates/vercelify-mesh" }

[profile.release]
# Fat LTO and size-first code keep the static daemons inside their budgets
# (design §16): the agent is ~7.6 MiB this way, ~8.9 MiB with thin LTO and
# "s". Per-crate opt-levels are worse under fat LTO (10.4 MiB), so the whole
# workspace builds for size; the daemons wait on I/O, and the app's UI is
# the webview's work.
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
