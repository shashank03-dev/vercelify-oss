# Vercelify power-guard. Restart after editing:
#   sudo systemctl restart vercelify-power-guard

# On battery (AC unplugged): shut down gracefully at or below this level.
BATTERY_SHUTDOWN_PCT=15
BATTERY_WARN_PCT=30

# CPU temperature (°C). The installer picks these per machine (a Raspberry Pi
# throttles itself near 80 °C, so it gets lower values than a laptop).
#   PAUSE:    pause builds and the AI server, slow apps down
#   FREEZE:   also freeze apps (databases and the proxy are never frozen)
#   RESUME:   undo all of it
#   SHUTDOWN: graceful shutdown after three readings in a row
THERMAL_PAUSE_C=92
THERMAL_RESUME_C=80
THERMAL_SHUTDOWN_C=98
#THERMAL_FREEZE_C=95
THERMAL_CPU_CAP_PCT=50

# Seconds between checks; seconds each container gets to stop cleanly.
INTERVAL=20
CONTAINER_STOP_TIMEOUT=60

# Stop charging at this % to protect a battery that is always plugged in
# (only on laptops whose firmware supports it; empty = leave as is).
CHARGE_STOP_THRESHOLD=80

# Optional push notification URL, e.g. https://ntfy.sh/my-secret-topic
NOTIFY_URL=

# Opt-in battery conservation. A host without a real battery never enters these
# stages. Only apps already opted into Sleep (and its previews toggle) may sleep.
BATTERY_POLICY_ENABLED=0
BATTERY_BUILD_HOLD_PCT=50
BATTERY_WORK_PAUSE_PCT=40
BATTERY_PREVIEW_SLEEP_PCT=30
BATTERY_APP_SLEEP_PCT=20
BATTERY_DEBOUNCE_READINGS=2
# Recovery requires continuous AC and charge >= entered-tier threshold + headroom.
BATTERY_HYSTERESIS_PCT=5
BATTERY_RECOVERY_AC_SECONDS=60
