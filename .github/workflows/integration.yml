name: Integration

# Slower checks against real software, run when the code they cover changes,
# every Monday (to catch upstream changes early) and on demand:
#   - project rules (vercel.json) on the engine's own proxy: redirects,
#     rewrites, headers, firewall and cron jobs through the agent
#   - the mesh: four nodes in network namespaces with the real agent and
#     vercelify-mesh (joining, paths, DNS, firewall, rotation, revocation),
#     then three behind real NAT routers (hole punching, the relay)
#   - multi-node: a worker with its own Docker in a network namespace; an
#     app placed on it through the mesh registry, replicas on both servers,
#     logs, restart, a terminal, automatic rollback and revocation; then the
#     warm standby promoted after the main server dies
#   - the engine on real Docker: builds, deployments, rollbacks, compose
#     apps (the deployment boundary, kept checkouts), databases and storage
#     (the VERCELIFY_DOCKER_TESTS tests that ordinary CI skips)
#   - the real installer in a systemd container (Docker, the agent with the
#     engine and its proxy, the mesh, guard, firewall, an app deployed),
#     twice, to prove it is idempotent
on:
  pull_request:
    # Whole crates rather than a list of modules: a change confined to one
    # module (compose, builds, storage, the proxy) must not skip these.
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/vercelify-core/**
      - crates/vercelify-platform/**
      - crates/vercelify-mesh/**
      - agent/**
      - host/setup-host.sh
      - host/vercelify
      - host/firewall.sh
      - host/lib/**
      - host/systemd/**
      - host/tests/contract/**
      - host/tests/integration/**
      - install.sh
      - .github/workflows/integration.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-contract:
    name: Project rules on the proxy (${{ matrix.traefik }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The engine's pinned proxy, and an older one (no status rewrite for
        # fallbacks): an early warning, not a gate.
        traefik: ["traefik:v3.7", "traefik:v3.4"]
    continue-on-error: ${{ matrix.traefik != 'traefik:v3.7' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vercelify-agent
      - name: Contract
        run: sudo -E env "PATH=$PATH" TRAEFIK_IMAGE="${{ matrix.traefik }}" AGENT_BIN="$PWD/target/debug/vercelify-agent" host/tests/contract/routing.sh

  platform-docker:
    name: Engine on real Docker (compose, databases, storage)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker compose version
      - name: Ignored Docker tests
        run: sudo -E env "PATH=$PATH" VERCELIFY_DOCKER_TESTS=1 cargo test -p vercelify-platform -- --include-ignored --test-threads 1

  mesh-contract:
    name: Mesh in network namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vercelify-agent && cargo build -p vercelify-mesh --features daemon
      - run: sudo apt-get update && sudo apt-get install -y iputils-ping jq
      - name: Contract
        run: sudo -E env "PATH=$PATH" host/tests/contract/mesh.sh
      - name: NAT traversal (hole punching, relay)
        run: sudo -E env "PATH=$PATH" host/tests/contract/mesh-nat.sh

  multinode-contract:
    name: Two servers (platform worker over the mesh)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vercelify-agent && cargo build -p vercelify-mesh --features daemon
      - run: sudo apt-get update && sudo apt-get install -y iputils-ping jq
      - name: Contract
        run: sudo -E env "PATH=$PATH" host/tests/contract/multinode.sh
      - name: Warm standby and promote
        run: sudo -E env "PATH=$PATH" host/tests/contract/promote.sh

  installer:
    name: Installer on Debian 12 (systemd)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'installer')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: pip install cargo-zigbuild
      - run: cargo zigbuild --release -p vercelify-agent --target x86_64-unknown-linux-musl
      - run: cargo zigbuild --release -p vercelify-mesh --features daemon --target x86_64-unknown-linux-musl
      - run: |
          rel="$PWD/target/x86_64-unknown-linux-musl/release"
          sudo AGENT_BINARY="$rel/vercelify-agent" MESH_BINARY="$rel/vercelify-mesh" REGISTRY_MIRROR=https://mirror.gcr.io host/tests/integration/run.sh
