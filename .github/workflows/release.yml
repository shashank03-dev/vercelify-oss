name: Release

# Push a tag like v0.1.0 to publish:
#   - vercelify-agent-<target>, vercelify-mesh-<target> (+ .sha256) — the
#     installers download these (the Mac's: vercelify-mesh-universal-apple-darwin)
#   - the cockpit app: macOS universal .dmg, Linux .deb and .AppImage
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    name: Agent ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version (the installer fetches the agent of its own version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v in Cargo.toml"; exit 1; }
          grep -q "\"version\": \"$v\"" cockpit/src-tauri/tauri.conf.json || { echo "tauri.conf.json version differs"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pip install cargo-zigbuild
      - run: cargo zigbuild --release --locked -p vercelify-agent --target ${{ matrix.target }}
      - run: cargo zigbuild --release --locked -p vercelify-mesh --features daemon --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p out
          for bin in vercelify-agent vercelify-mesh; do
            cp "target/${{ matrix.target }}/release/$bin" "out/$bin-${{ matrix.target }}"
            (cd out && sha256sum "$bin-${{ matrix.target }}" > "$bin-${{ matrix.target }}.sha256")
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*

  mesh-macos:
    name: vercelify-mesh for macOS (universal)
    runs-on: macos-14
    env:
      # Signed and notarised with the app's secrets (see the cockpit job), so
      # Gatekeeper and the firewall treat the daemon like the app.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p vercelify-mesh --features daemon --target "$t"
          done
      - name: Package
        run: |
          mkdir -p out
          lipo -create -output out/vercelify-mesh-universal-apple-darwin \
            target/aarch64-apple-darwin/release/vercelify-mesh target/x86_64-apple-darwin/release/vercelify-mesh
      - name: Sign and notarise vercelify-mesh
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/mesh.keychain-db" kcpw=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/mesh.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/mesh.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/mesh.p12"
          bin=out/vercelify-mesh-universal-apple-darwin
          codesign --force --options runtime --timestamp --identifier dev.vercelify.mesh \
            --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          ditto -c -k "$bin" "$RUNNER_TEMP/mesh.zip"
          xcrun notarytool submit "$RUNNER_TEMP/mesh.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          security delete-keychain "$kc"
      - name: Checksum
        run: cd out && shasum -a 256 vercelify-mesh-universal-apple-darwin > vercelify-mesh-universal-apple-darwin.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*

  cockpit:
    name: Cockpit ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      # Signing and notarisation turn on when the repository has these secrets
      # (Settings → Secrets → Actions): APPLE_CERTIFICATE (base64 .p12 of a
      # "Developer ID Application" certificate), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (an app-specific
      # password) and APPLE_TEAM_ID. Without them the build is unsigned.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Sign and notarise the macOS app
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # tauri-action reads these from the environment: set them only when
        # all are present, so a half-configured repository still builds.
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::warning::$v is not set — building unsigned"; exit 0; }
          done
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "::add-mask::${!v}"
            echo "$v=${!v}" >>"$GITHUB_ENV"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
        working-directory: cockpit
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: cockpit
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Vercelify ${{ github.ref_name }}
          releaseBody: |
            **Host:** `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash`
            **Mac:** download the `.dmg` below (or `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install-mac.sh | bash`). If this release isn't signed: right-click → Open the first time.
          releaseDraft: false
      # Without a Developer ID the linker's signature is all the app has, and
      # macOS can't keep Screen Recording allowed for it. MACOS_SELF_SIGNED_P12
      # (base64 .p12 of a self-signed code-signing certificate, password in
      # MACOS_SELF_SIGNED_PASSWORD) keeps the permission across updates.
      - name: Seal the macOS app
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          SIGN_P12: ${{ secrets.MACOS_SELF_SIGNED_P12 }}
          SIGN_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_PASSWORD }}
        run: |
          if [ -n "$SIGN_P12" ]; then
            kc="$RUNNER_TEMP/sign.keychain-db" pw=$(uuidgen)
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings "$kc"
            security unlock-keychain -p "$pw" "$kc"
            # codesign finds the identity only in a keychain on the search list.
            # shellcheck disable=SC2046
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            base64 --decode <<<"$SIGN_P12" >"$RUNNER_TEMP/sign.p12"
            security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$SIGN_PASSWORD" -T /usr/bin/codesign >/dev/null
            rm -f "$RUNNER_TEMP/sign.p12"
            security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null
            MAC_SIGN_IDENTITY=$(security find-identity -p codesigning "$kc" | awk '$1 ~ /\)$/ {print $2; exit}')
            [ -n "$MAC_SIGN_IDENTITY" ] || { echo "::error::no code-signing identity in MACOS_SELF_SIGNED_P12"; exit 1; }
            export MAC_SIGN_IDENTITY MAC_SIGN_KEYCHAIN="$kc"
          else
            echo "::warning::MACOS_SELF_SIGNED_P12 is not set: signing ad hoc, so Screen Recording must be allowed again after each update"
          fi
          dmg=$(jq -r '.[]' <<<"$PATHS" | grep '\.dmg$' | head -1)
          app=$(find "$(dirname "$dmg")/../macos" -maxdepth 1 -name '*.app' | head -1)
          tgz_name=$(gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' | grep '\.app\.tar\.gz$' | head -1 || true)
          tgz=${tgz_name:+$RUNNER_TEMP/$tgz_name}
          .github/scripts/seal-macos-app.sh "$app" "$dmg" "$tgz"
          gh release upload "${{ github.ref_name }}" "$dmg" ${tgz:+"$tgz"} --clobber
      # install-mac.sh refuses a disk image without its checksum.
      - name: Checksums for the disk images
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          jq -r '.[]' <<<"$PATHS" | grep '\.dmg$' | while read -r f; do
            (cd "$(dirname "$f")" && shasum -a 256 "$(basename "$f")" >"$(basename "$f").sha256")
            gh release upload "${{ github.ref_name }}" "$f.sha256" --clobber
          done
