name: Feature request
description: Suggest an idea for Vercelify
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      options:
        - label: Works on low-end hardware (8 GB RAM, HDD)
        - label: Adds no recurring cost or required cloud service
