<text x="520.0" y="21" text-anchor="middle" fill="#8a8780" style="font-size:12px">you@old-laptop: Ubuntu 24.04 (the server)</text>
<g xml:space="preserve"><g class="v0"><text x="18" y="62.5"><tspan fill="#ff8a5c">$ </tspan><tspan fill="#f4f2ee" font-weight="600">curl -fsSL https://raw.githubusercontent.com/shashank03-dev/vercelify-oss/main/install.sh | sudo bash -s -- --storage-device none</tspan></text><g class="c0"><rect x="32.0" y="50.0" width="983.5" height="19" fill="#0f0f0e"/><rect x="32.0" y="51.0" width="7.5" height="15.5" fill="#ff8a5c" class="k0"/></g></g><g class="v1"><text x="18" y="81.5"></text></g><g class="v2"><text x="18" y="100.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Preflight</tspan></text></g><g class="v3"><text x="18" y="119.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">Ubuntu 24.04.1 LTS</tspan></text></g><g class="v4"><text x="18" y="138.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">hardware profile: laptop (Latitude E7450)</tspan></text></g><g class="v5"><text x="18" y="157.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">architecture amd64</tspan></text></g><g class="v6"><text x="18" y="176.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">7842 MB RAM, 187 GB free on /</tspan></text></g><g class="v7"><text x="18" y="195.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">internet access</tspan></text></g><g class="v8"><text x="18" y="214.5"></text></g><g class="v9"><text x="18" y="233.5"><tspan fill="#6cc9e0">  Vercelify 0.2.0 — self-hosted Vercel on this machine</tspan></text></g><g class="v10"><text x="18" y="252.5"><tspan fill="#8a8780">    Role: main · Host: old-laptop · Answer a few questions (Enter = default).</tspan></text></g><g class="v11"><text x="18" y="271.5"></text></g><g class="v12"><text x="18" y="290.5"><tspan fill="#f0bf4c">  ? </tspan><tspan fill="#d8d6d0">Set up local AI models too? [y/N] </tspan><tspan fill="#f4f2ee" font-weight="600">n</tspan></text><g class="c12"><rect x="302.0" y="278.0" width="23.5" height="19" fill="#0f0f0e"/><rect x="302.0" y="279.0" width="7.5" height="15.5" fill="#ff8a5c" class="k12"/></g></g><g class="v13"><text x="18" y="309.5"><tspan fill="#f0bf4c">  ? </tspan><tspan fill="#d8d6d0">Your domain (blank = private only, add one later with &#x27;vercelify domain&#x27;): </tspan><tspan fill="#f4f2ee" font-weight="600"></tspan></text></g><g class="v14"><text x="18" y="62.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Plan</tspan></text></g><g class="v15"><text x="18" y="81.5"><tspan fill="#6cc9e0">  • </tspan><tspan fill="#d8d6d0">role:       main</tspan></text></g><g class="v16"><text x="18" y="100.5"><tspan fill="#6cc9e0">  • </tspan><tspan fill="#d8d6d0">name:       old-laptop</tspan></text></g><g class="v17"><text x="18" y="119.5"><tspan fill="#6cc9e0">  • </tspan><tspan fill="#d8d6d0">storage:    none → /mnt/storage</tspan></text></g><g class="v18"><text x="18" y="138.5"><tspan fill="#6cc9e0">  • </tspan><tspan fill="#d8d6d0">domain:     none — apps private to your Vercelify network via sslip.io</tspan></text></g><g class="v19"><text x="18" y="157.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Base packages</tspan></text></g><g class="v20"><text x="18" y="176.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Laptop server mode</tspan></text></g><g class="v21"><text x="18" y="195.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Kernel &amp; memory tuning</tspan></text></g><g class="v22"><text x="18" y="214.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Hardware (laptop: Latitude E7450)</tspan></text></g><g class="v23"><text x="18" y="233.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Storage tier (/mnt/storage)</tspan></text></g><g class="v24"><text x="18" y="252.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Docker Engine</tspan></text></g><g class="v25"><text x="18" y="271.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Vercelify agent</tspan></text></g><g class="v26"><text x="18" y="290.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Private network (vercelify-mesh)</tspan></text></g><g class="v27"><text x="18" y="309.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">this server coordinates the mesh as 10.77.0.1</tspan></text></g><g class="v28"><text x="18" y="328.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">App addresses</tspan></text></g><g class="v29"><text x="18" y="347.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">wildcard domain → http://10.77.0.1.sslip.io</tspan></text></g><g class="v30"><text x="18" y="62.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Power &amp; thermal guard</tspan></text></g><g class="v31"><text x="18" y="81.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Firewall</tspan></text></g><g class="v32"><text x="18" y="100.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Reboot window</tspan></text></g><g class="v33"><text x="18" y="119.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Backups</tspan></text></g><g class="v34"><text x="18" y="62.5"><tspan fill="#5bd47e">✔ Vercelify is ready</tspan><tspan fill="#d8d6d0">  (main, 0.2.0)</tspan></text></g><g class="v35"><text x="18" y="81.5"></text></g><g class="v36"><text x="18" y="100.5"><tspan fill="#f4f2ee" font-weight="600">  Apps               </tspan><tspan fill="#d8d6d0">http://&lt;app&gt;.10.77.0.1.sslip.io</tspan></text></g><g class="v37"><text x="18" y="119.5"><tspan fill="#f4f2ee" font-weight="600">  Network            </tspan><tspan fill="#d8d6d0">old-laptop at 10.77.0.1 (vfy0)</tspan></text></g><g class="v38"><text x="18" y="138.5"><tspan fill="#f4f2ee" font-weight="600">  Storage            </tspan><tspan fill="#d8d6d0">single disk (/mnt/storage on /)</tspan></text></g><g class="v39"><text x="18" y="157.5"></text></g><g class="v40"><text x="18" y="176.5"><tspan fill="#f4f2ee" font-weight="600">  Connect your Mac</tspan></text></g><g class="v41"><text x="18" y="195.5"><tspan fill="#d8d6d0">    1. Install the app:</tspan></text></g><g class="v42"><text x="18" y="214.5"><tspan fill="#d8d6d0">         curl -fsSL https://raw.githubusercontent.com/shashank03-dev/vercelify-oss/main/install-mac.sh | bash</tspan></text></g><g class="v43"><text x="18" y="233.5"><tspan fill="#d8d6d0">    2. Open Vercelify: on the same Wi-Fi pick </tspan><tspan fill="#f4f2ee" font-weight="600">old-laptop</tspan><tspan fill="#d8d6d0"> and type the code   </tspan><tspan fill="#ff8a5c">K7QF-M2XD</tspan><tspan fill="#d8d6d0">   (valid 1 hour)</tspan></text></g><g class="v44"><text x="18" y="252.5"><tspan fill="#d8d6d0">       or, anywhere, paste the full code:</tspan></text></g><g class="v45"><text x="18" y="271.5"><tspan fill="#8a8780">         vfy2.eyJhZ2VudF91cmwiOiJodHRwOi8vMTAuNzcuMC4xOjc0MjAi…</tspan></text></g><g class="v46"><text x="18" y="290.5"></text></g><g class="v47"><text x="18" y="309.5"><tspan fill="#d8d6d0">  New code any time: sudo vercelify pair</tspan></text></g><g class="v48"><text x="18" y="328.5"></text></g><g class="v49"><text x="18" y="347.5"><tspan fill="#8a8780">  Health check: sudo vercelify doctor     Logs: /var/log/vercelify-setup.log</tspan></text></g></g>
</svg>
