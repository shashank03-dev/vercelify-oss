<text x="430.0" y="21" text-anchor="middle" fill="#8a8780" style="font-size:12px">you@macbook: vercelify-oss</text>
<g xml:space="preserve"><g class="v0"><text x="18" y="62.5"><tspan fill="#ff8a5c">$ </tspan><tspan fill="#f4f2ee" font-weight="600">./cli/vfy why --log cli/examples/failed-build.log --provider gemini</tspan></text><g class="c0"><rect x="32.0" y="50.0" width="518.5" height="19" fill="#0f0f0e"/><rect x="32.0" y="51.0" width="7.5" height="15.5" fill="#ff8a5c" class="k0"/></g></g><g class="v1"><text x="18" y="81.5"><tspan fill="#ff8a5c">**Cause:**</tspan><tspan fill="#d8d6d0"> The `next build` step failed because `./app/page.tsx` attempts to import a component</tspan></text></g><g class="v2"><text x="18" y="100.5"><tspan fill="#d8d6d0">using a case-sensitive path that does not match the actual filename on the Linux filesystem.</tspan></text></g><g class="v3"><text x="18" y="119.5"></text></g><g class="v4"><text x="18" y="138.5"><tspan fill="#ff8a5c">**Fix:**</tspan><tspan fill="#d8d6d0"> Rename the import in `app/page.tsx` to match the exact casing of the file in the</tspan></text></g><g class="v5"><text x="18" y="157.5"><tspan fill="#d8d6d0">`components/` directory (e.g., change `../components/Header` to `../components/header` if</tspan></text></g><g class="v6"><text x="18" y="176.5"><tspan fill="#d8d6d0">the file is lowercase).</tspan></text></g><g class="v7"><text x="18" y="195.5"></text></g><g class="v8"><text x="18" y="214.5"><tspan fill="#ff8a5c">**Check:**</tspan><tspan fill="#d8d6d0"> `ls components/` to verify the exact casing of the file, then `npm run build` to</tspan></text></g><g class="v9"><text x="18" y="233.5"><tspan fill="#d8d6d0">test the import locally.</tspan></text></g><g class="v10"><text x="18" y="252.5"></text></g><g class="v11"><text x="18" y="271.5"><tspan fill="#8a8780">— gemma-4-26b-a4b-it via the Gemini API (Gemma 4, Apache 2.0)</tspan></text></g></g>
</svg>
