<text x="520.0" y="21" text-anchor="middle" fill="#8a8780" style="font-size:12px">you@macbook: Terminal (your Mac)</text>
<g xml:space="preserve"><g class="v0"><text x="18" y="62.5"><tspan fill="#ff8a5c">$ </tspan><tspan fill="#f4f2ee" font-weight="600">curl -fsSL https://raw.githubusercontent.com/shashank03-dev/vercelify-oss/main/install-mac.sh | bash</tspan></text><g class="c0"><rect x="32.0" y="50.0" width="766.0" height="19" fill="#0f0f0e"/><rect x="32.0" y="51.0" width="7.5" height="15.5" fill="#ff8a5c" class="k0"/></g></g><g class="v1"><text x="18" y="81.5"></text></g><g class="v2"><text x="18" y="100.5"><tspan fill="#6cc9e0">  Vercelify for Mac</tspan><tspan fill="#d8d6d0"> — your own Vercel on your old laptops</tspan></text></g><g class="v3"><text x="18" y="119.5"></text></g><g class="v4"><text x="18" y="138.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Vercelify app</tspan></text></g><g class="v5"><text x="18" y="157.5"><tspan fill="#f0bf4c">  ! </tspan><tspan fill="#d8d6d0">no downloadable release of shashank03-dev/vercelify-oss yet</tspan></text></g><g class="v6"><text x="18" y="176.5"><tspan fill="#f0bf4c">  ? </tspan><tspan fill="#d8d6d0">Build the app from source now (needs Xcode CLT, Node 20+ and Rust)? [y/N] </tspan><tspan fill="#f4f2ee" font-weight="600">y</tspan></text><g class="c6"><rect x="602.0" y="164.0" width="23.5" height="19" fill="#0f0f0e"/><rect x="602.0" y="165.0" width="7.5" height="15.5" fill="#ff8a5c" class="k6"/></g></g><g class="v7"><text x="18" y="195.5"></text></g><g class="v8"><text x="18" y="214.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Building Vercelify from source (one time, 5–15 minutes)</tspan></text></g><g class="v9"><text x="18" y="233.5"><tspan fill="#8a8780">  … npm ci, then tauri build (output shortened) …</tspan></text></g><g class="v10"><text x="18" y="252.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">installed /Applications/Vercelify.app</tspan></text></g><g class="v11"><text x="18" y="271.5"></text></g><g class="v12"><text x="18" y="290.5"><tspan fill="#6cc9e0">==&gt; </tspan><tspan fill="#f4f2ee" font-weight="600">Vercelify network (vercelify-mesh: your servers, privately, from anywhere)</tspan></text></g><g class="v13"><text x="18" y="309.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">vercelify-mesh runs in your session; the app joins it to your servers&#x27; network when you pair</tspan></text></g><g class="v14"><text x="18" y="328.5"><tspan fill="#5bd47e">  ✓ </tspan><tspan fill="#d8d6d0">vfy installed in /usr/local/bin (try: vfy apps)</tspan></text></g><g class="v15"><text x="18" y="347.5"></text></g><g class="v16"><text x="18" y="366.5"><tspan fill="#5bd47e">✔ Done.</tspan><tspan fill="#d8d6d0"> Opening Vercelify…</tspan></text></g><g class="v17"><text x="18" y="385.5"></text></g><g class="v18"><text x="18" y="404.5"><tspan fill="#d8d6d0">  Next: on your old laptop run the server installer, then pick it in the app</tspan></text></g><g class="v19"><text x="18" y="423.5"><tspan fill="#d8d6d0">  and type the 8-character code it shows.</tspan></text></g></g>
</svg>
